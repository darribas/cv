# Subset CV config — annotated template.
#
# A subset CV is a shorter, audience-specific version of the full CV, built
# from the same data:   make subset CONFIG=subsets/erc-2027.toml
# This file documents every key; it is the only subset file in the
# repository.
#
# Keep configs in the repo's subsets/ folder (gitignored), e.g.
# subsets/erc-2027.toml, or anywhere outside the repo. Outputs are written
# beside the config, in a folder named after it (subsets/erc-2027/). Inside
# the repo the build writes only where git ignores the path, and never to
# docs/ or src/, so a subset can't be committed or published.
#
# Easier start: `make subset CONFIG=subsets/x.toml` with no file there
# yet writes a config listing every section, group and record id; build a
# subset by deleting lines and running the same command again.
# `make subset-list [SECTION="Teaching"]` prints the ids with their dates
# and titles.
#
# Keys marked (P3)…(P5) belong to phases not built yet
# (notes/SUBSET-CV-SPEC.md §15); using one is an error that says so.

name    = "example"         # output folder + file names (darribas-cv-<name>.pdf);
                            # a-z, 0-9 and "-"; default: the config's file name
formats = ["pdf"]           # "pdf"; "docx" and "md" come in P4

[header]
title = "Curriculum Vitae"  # replaces the document heading (basics.title)
# affiliation = ["…", "…"]  # (P5) replaces the address lines
# email = false             # (P5) replace, or false to omit
# url   = false             # (P5) replace, or false to omit

# [style]                   # (P3) typography; every key optional
# font         = "Arial"    #   must be installed — the build checks
# size         = 11         #   body size, pt (8–14)
# paper        = "a4"       #   "a4" | "us-letter"
# margins      = 20         #   mm, all sides (10–40)
# page_numbers = true       #   "1 of 3", centred footer
# fallback     = "Liberation Sans"  # used, with a warning, if `font` is missing

[money]                     # for `total` summaries; every key optional
currency   = "GBP"          # the currency totals are shown in (GBP, EUR, USD)
source     = "live"         # "live": today's ECB reference rates, fetched only
                            #   when a total mixes currencies; these rates are
                            #   the fallback (with a warning) if that fails.
                            # "config": always these rates, never the network.
rates_date = 2026-09-24     # the date of the rates below; required with them
                            #   (a warning once it is 90+ days old)
[money.rates]               # 1 unit of each currency = this many GBP; the
EUR = 0.87                  #   manifest.json of a live build records the
USD = 0.74                  #   rates it used in this form, ready to paste

[summary]
default = []                # metrics for every section without its own
                            #   `summary` (groups only get one explicitly)

# Metrics, shown in italics under the heading, joined by " · ":
#   "count" -> "12 of 112 publications", or "112 publications" if none dropped
#   "total" -> "≈ £1.3M of ≈ £4.4M total award value": the summed `amount` of
#              the award (type grant) entries — whole awards, not a share —
#              with ≈ and a "Converted to GBP at …" note when currencies were
#              converted. Awards without an amount are counted in brackets.

# ---- Sections --------------------------------------------------------------
# Listed -> included, in the order listed; unlisted -> dropped.
# Nothing more specified -> the whole section (as it is when built, so a later
# rebuild picks up new records). `ids` -> only those records, printed in data
# order. Titles must match the data exactly (see --list).
#
# Instead of [[section]] tables you can write   drop = ["Teaching", ...]
# to keep every section except those. Use one or the other, not both.

[[section]]
title = "Education"               # the whole section

[[section]]
title  = "Publications"
rename = "Selected Publications"  # heading shown; matching still uses `title`
ids = [                           # only these records; a grouped section's ids
  "rey2023geographic",            # may come from any of its groups, and groups
]                                 # left empty are dropped
summary = ["count"]               # "1 of 112 publications"

[[section]]
title   = "Research Income"
summary = ["count", "total"]      # "22 of 28 items · ≈ £…M total award value · …"
  [[section.group]]               # only these groups, in this order
  title = "Awards"                # the whole group
  # rename, ids and summary work here as on a section. A section with
  # group tables takes its ids under the groups, not at section level.
